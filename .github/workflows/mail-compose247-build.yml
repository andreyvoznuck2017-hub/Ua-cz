name: Build reply editor 2.4.7
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths: ['mail-compose247/MailCompose247.java', 'mail-compose247/build.py', '.github/workflows/mail-compose247-build.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: mail-compose246-unsigned-1
          run-id: 37336108124
          github-token: ${{ github.token }}
          path: baseline246
      - name: Compile scoped native changes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          python3 mail-compose247/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-compose247-unsigned-${{ github.run_number }}
          path: candidate247/
          retention-days: 7
          if-no-files-found: error
