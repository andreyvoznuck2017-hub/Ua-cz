name: Mail 2.4.4 Android 15 entry test
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths: ['mail-next244/login-entry.py', '.github/workflows/mail-next244-entry.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QA_API: '35'
      QA_SHA256: 7c6441b64f81ad461eb763016bfab2d3b0cf0726b8db8705da96d1ad97907e10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed baseline and candidate
        run: |
          set -euo pipefail
          mkdir -p signed-input runtime-output
          curl --fail --location --max-time 90 --retry 2 'https://test.jkunis.eu/android-qa-20261005-v244-r1/Svoyi-Android-2.4.4.apk' -o signed-input/app.apk
          echo "$QA_SHA256  signed-input/app.apk" | sha256sum --check
          curl --fail --location --max-time 90 --retry 2 'https://test.jkunis.eu/android-qa-20261005-v243-r5b/Svoyi-Android-2.4.3.apk' -o signed-input/baseline243.apk
          echo '36071a614fece010136aba12917dfdfab95bbbe1ecd712a1d6b7a9c41cb95990  signed-input/baseline243.apk' | sha256sum --check
          python3 -m pip install requests beautifulsoup4 playwright
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Real UI actions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mail-next244/login-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail244-entry35-${{ github.run_number }}
          path: runtime-output/
          retention-days: 7
          if-no-files-found: error
