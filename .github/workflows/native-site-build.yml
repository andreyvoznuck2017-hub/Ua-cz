name: Native site-match build and runtime
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths:
      - 'repair/**'
      - 'repair-extra/**'
      - '.github/workflows/native-site-build.yml'
permissions:
  contents: read
concurrency:
  group: native-site-match
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare native tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          python3 -m pip install cryptography
      - name: Compile native layout and sign isolated QA APK
        run: |
          python3 repair-extra/refine.py
          python3 repair/build.py
      - name: Save candidate and integrity record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-site-candidate-${{ github.run_number }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 7
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: native-site-candidate-${{ github.run_number }}
          path: candidate-input
      - name: Prepare isolated UI test tools
        run: |
          set -euo pipefail
          python3 -m pip install requests beautifulsoup4 pillow playwright
          python3 -m playwright install --with-deps chromium
          mkdir -p runtime-output/candidate
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Test exact final candidate with non-empty mailbox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QA_APK=candidate-input/Svoyi-Europe-Android-v2.4.2-Site-Match-QA.apk QA_PACKAGE=eu.svoyi.testapp02 QA_PHASE=api${{ matrix.api }}-candidate QA_OUTPUT=runtime-output/candidate python3 repair/stress-diagnostic.py
      - name: Save actual screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-site-api-${{ matrix.api }}-${{ github.run_number }}
          path: runtime-output/
          if-no-files-found: error
          retention-days: 7
