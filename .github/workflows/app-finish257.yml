name: Svoyi 2.5.7 home and mail verification
on:
  push:
    branches: [android-home-mail-257]
    paths: ['app-finish257/**', 'release257/**', '.github/workflows/app-finish257.yml']
permissions:
  contents: read
concurrency:
  group: home-mail-257
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify signed APK and compile native changes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          python3 app-finish257/build.py
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 26 --max-sdk-version 36 release257/Svoyi-2.5.7.apk
          "$BT/zipalign" -c 4 release257/Svoyi-2.5.7.apk
          sha256sum release257/Svoyi-2.5.7.apk
          python3 -m pip install requests beautifulsoup4 pillow
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'APK=release257/Svoyi-2.5.7.apk BEFORE_APK=release256/Svoyi-2.5.6.apk QA_API=36 QA_OUT=home-mail-qa python3 app-finish257/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-mail-api36
          path: home-mail-qa/
          retention-days: 14
