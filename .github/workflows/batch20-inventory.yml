name: Batch20 current reference
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths: ['batch20/inspect.py','.github/workflows/batch20-inventory.yml']
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mail-compose247-unsigned-1
          run-id: 37345161152
          github-token: ${{ github.token }}
          path: baseline247
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baseline code and live test-site reference
        run: |
          set -euo pipefail
          mkdir -p runtime-output tooling
          echo '8ae3acf1150b6422ec8309e7477c398d7461082e9bda35d00877ffdb08f5af42  baseline247/Svoyi-2.4.7-unsigned.apk' | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          python3 -m pip install requests beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('baseline247/Svoyi-2.4.7-unsigned.apk') as z:Path('tooling/classes3.dex').write_bytes(z.read('classes3.dex'))
          PY
          baksmali disassemble tooling/classes3.dex -o runtime-output/smali247
          python3 -P batch20/inspect.py
      - name: Retain measured reference not release claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch20-reference-${{ github.run_number }}
          path: runtime-output/
          retention-days: 7
          if-no-files-found: error
