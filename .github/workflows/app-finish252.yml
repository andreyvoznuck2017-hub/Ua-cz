name: Final app 2.5.2 build and QA

on:
  workflow_dispatch:
  push:
    branches: [android-app-finish]
    paths:
      - 'app-finish252/**'
      - '.github/workflows/app-finish252.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-5
          run-id: 37450779825
          github-token: ${{ github.token }}
          path: verified-baseline
      - name: Prepare verified 2.4.9 baseline and Android tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          echo 'fb8e989ee5dac4e89127b1e61beb94c59e7d0dc8b2774ad7fe84dd4fe989a8e1  verified-baseline/Svoyi-Before-2.4.9-QA.apk' | sha256sum --check
          cp verified-baseline/Svoyi-Before-2.4.9-QA.apk app-finish252/baseline249.apk
          unzip -t app-finish252/baseline249.apk >/dev/null
      - name: Build baseline and final QA APK
        run: python3 app-finish252/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: app-finish252/releases/
          retention-days: 14
          if-no-files-found: error

  qa-android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: qa-apks
      - name: Install QA dependencies
        run: python3 -m pip install requests beautifulsoup4 pillow
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Full route, click and before-after QA on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'BEFORE_APK=qa-apks/Svoyi-Before-2.4.9-QA.apk FINAL_APK=qa-apks/Svoyi-Final-2.5.2-QA.apk QA_OUT=finish252-qa python3 app-finish252/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish252-android16-qa-${{ github.run_number }}
          path: finish252-qa/
          retention-days: 14
          if-no-files-found: error

  smoke-android15:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: qa-apks
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Final APK launch smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb install -r -g qa-apks/Svoyi-Final-2.5.2-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 8; adb shell pidof eu.svoyi.qa.finish252; ! adb logcat -d | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  smoke-android9:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: qa-apks
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Legacy Android launch, large-font and LocationListener smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb shell settings put system font_scale 1.3; adb install -r -g qa-apks/Svoyi-Final-2.5.2-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 10; adb shell pidof eu.svoyi.qa.finish252; LOG="$(adb logcat -d)"; ! printf "%s" "$LOG" | grep -q "AbstractMethodError"; ! printf "%s" "$LOG" | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  publish:
    needs: [qa-android16, smoke-android15, smoke-android9]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-finish
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: finish252-android16-qa-${{ github.run_number }}
          path: qa-proof
      - name: Publish verified APK and before-after proof
        run: |
          set -euo pipefail
          mkdir -p app-finish252/published
          cp -f release/* app-finish252/published/
          cp -f qa-proof/before-after-home.png app-finish252/published/
          cp -f qa-proof/before-after-account.png app-finish252/published/
          cp -f qa-proof/checks.json app-finish252/published/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-finish252/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified final app 2.5.2 QA'
          git push origin HEAD:android-app-finish
