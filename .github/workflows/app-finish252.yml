name: Final app 2.5.2 build and QA

on:
  workflow_dispatch:
  push:
    branches: [android-app-finish]
    paths:
      - 'app-finish252/**'
      - '.github/workflows/app-finish252.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: batch20-unsigned-1
          run-id: 37354449484
          github-token: ${{ github.token }}
          path: baseline248
      - name: Prepare valid 2.4.9 baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          curl --fail --proto '=https' --location --retry 3 --max-time 120 \
            'https://test.jkunis.eu/android-home10-249-qa-db5f499b-r2/Svoyi-2.4.9-Home10-Code-and-QA.zip' \
            -o /tmp/home249.zip
          rm -rf /tmp/home249 && mkdir -p /tmp/home249
          unzip -q /tmp/home249.zip -d /tmp/home249
          MATCH="$(find /tmp/home249 -type f -name '*.apk' -print0 | xargs -0 sha256sum | awk '$1=="db5f499b94514c440f145d20026c2debe5b7d183e26fcbc8a4ce5558b4cbf2fa"{print $2; exit}')"
          test -n "$MATCH"
          echo 'c97c63fcbe3ef497ff46594ff055ad0050fa2660c9e11d7bfe9c9e05af604041  baseline248/Svoyi-2.4.8-unsigned.apk' | sha256sum --check
          python3 - "$MATCH" <<'PY'
          import sys,zipfile
          old=zipfile.ZipFile('baseline248/Svoyi-2.4.8-unsigned.apk')
          new=zipfile.ZipFile(sys.argv[1])
          def zread(z,name):
              info=z.getinfo(name)
              with z.open(info) as fp:
                  fp._expected_crc=None
                  return fp.read()
          manifest=zread(new,'AndroidManifest.xml');classes3=zread(new,'classes3.dex')
          out=zipfile.ZipFile('app-finish252/baseline249.apk','w',zipfile.ZIP_DEFLATED)
          for info in old.infolist():
              data=old.read(info.filename)
              if info.filename=='AndroidManifest.xml':data=manifest
              elif info.filename=='classes3.dex':data=classes3
              zi=zipfile.ZipInfo(info.filename,info.date_time);zi.compress_type=info.compress_type;zi.external_attr=info.external_attr;zi.create_system=info.create_system
              out.writestr(zi,data)
          out.close();old.close();new.close()
          PY
          unzip -t app-finish252/baseline249.apk >/dev/null
      - name: Build baseline and final QA APK
        run: python3 app-finish252/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: app-finish252/releases/
          retention-days: 14
          if-no-files-found: error

  qa-android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: qa-apks
      - name: Install QA dependencies
        run: python3 -m pip install requests beautifulsoup4 pillow
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Full route, click and before-after QA on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'BEFORE_APK=qa-apks/Svoyi-Before-2.4.9-QA.apk FINAL_APK=qa-apks/Svoyi-Final-2.5.2-QA.apk QA_OUT=finish252-qa python3 app-finish252/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish252-android16-qa-${{ github.run_number }}
          path: finish252-qa/
          retention-days: 14
          if-no-files-found: error

  smoke-android15:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: qa-apks
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Final APK launch smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb install -r -g qa-apks/Svoyi-Final-2.5.2-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 8; adb shell pidof eu.svoyi.qa.finish252; ! adb logcat -d | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  publish:
    needs: [qa-android16, smoke-android15]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-finish
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: finish252-android16-qa-${{ github.run_number }}
          path: qa-proof
      - name: Publish verified APK and before-after proof
        run: |
          set -euo pipefail
          mkdir -p app-finish252/published
          cp -f release/* app-finish252/published/
          cp -f qa-proof/before-after-home.png app-finish252/published/
          cp -f qa-proof/before-after-account.png app-finish252/published/
          cp -f qa-proof/checks.json app-finish252/published/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-finish252/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified final app 2.5.2 QA'
          git push origin HEAD:android-app-finish
