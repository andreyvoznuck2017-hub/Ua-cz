name: Final app 2.5.3 social mail batch

on:
  workflow_dispatch:
  push:
    branches: [android-app-finish]
    paths:
      - 'app-finish253/**'
      - '.github/workflows/app-finish253.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-11
          run-id: 37454925850
          github-token: ${{ github.token }}
          path: baseline252
      - name: Prepare tools and baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          echo '3ba77212dd78df87338c77b4bdfb93c1471f3a11d30fa646fe88cdae4b30d5da  baseline252/Svoyi-Final-2.5.2-QA.apk' | sha256sum --check
          cp baseline252/Svoyi-Final-2.5.2-QA.apk app-finish253/baseline252.apk
      - name: Build 2.5.3 unsigned
        run: python3 app-finish253/build.py
      - name: Align and sign isolated QA APK
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -keystore /tmp/social253.p12 -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias socialqa -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Svoyi Social QA 2.5.3'
          "$BT/zipalign" -f 4 app-finish253/releases/Svoyi-Final-2.5.3-QA-unsigned.apk /tmp/social253-aligned.apk
          "$BT/apksigner" sign --ks /tmp/social253.p12 --ks-key-alias socialqa --ks-pass "pass:$PASS" --out app-finish253/releases/Svoyi-Final-2.5.3-QA.apk /tmp/social253-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs app-finish253/releases/Svoyi-Final-2.5.3-QA.apk > app-finish253/releases/signature.txt
          sha256sum app-finish253/releases/Svoyi-Final-2.5.3-QA.apk > app-finish253/releases/SHA256SUMS.txt
          rm -f app-finish253/releases/Svoyi-Final-2.5.3-QA-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: finish253-apk-${{ github.run_number }}
          path: app-finish253/releases/
          if-no-files-found: error
          retention-days: 14

  qa-android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apk-${{ github.run_number }}
          path: qa-apk
      - run: python3 -m pip install requests beautifulsoup4 pillow
      - run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Test dating housing groups notifications and mail
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'APK=qa-apk/Svoyi-Final-2.5.3-QA.apk QA_OUT=finish253-qa python3 app-finish253/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish253-qa-${{ github.run_number }}
          path: finish253-qa/
          if-no-files-found: error
          retention-days: 14

  smoke-android9:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apk-${{ github.run_number }}
          path: qa-apk
      - run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Legacy launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb uninstall eu.svoyi.qa.finish252 || true; adb install -g qa-apk/Svoyi-Final-2.5.3-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 10; adb shell pidof eu.svoyi.qa.finish252; ! adb logcat -d | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  publish:
    needs: [qa-android16, smoke-android9]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-finish
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apk-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: finish253-qa-${{ github.run_number }}
          path: proof
      - name: Publish verified 2.5.3 batch
        run: |
          set -euo pipefail
          mkdir -p app-finish253/published
          cp -f release/* app-finish253/published/
          cp -f proof/checks.json app-finish253/published/
          cp -f proof/after-dating.png app-finish253/published/ || true
          cp -f proof/after-housing.png app-finish253/published/ || true
          cp -f proof/after-mail.png app-finish253/published/ || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-finish253/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified social mail batch 2.5.3'
          git push origin HEAD:android-app-finish
