name: Social core 2.5.3 build and QA

on:
  workflow_dispatch:
  push:
    branches: [android-app-finish-253]
    paths:
      - 'app-finish253/**'
      - '.github/workflows/app-finish253.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: finish252-apks-11
          run-id: 37454925850
          github-token: ${{ github.token }}
          path: verified252
      - name: Prepare verified 2.5.2 baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          echo '3ba77212dd78df87338c77b4bdfb93c1471f3a11d30fa646fe88cdae4b30d5da  verified252/Svoyi-Final-2.5.2-QA.apk' | sha256sum --check
          cp verified252/Svoyi-Final-2.5.2-QA.apk app-finish253/baseline252.apk
          unzip -t app-finish253/baseline252.apk >/dev/null
      - name: Build before and social-core APK
        run: python3 app-finish253/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: finish253-apks-${{ github.run_number }}
          path: app-finish253/releases/
          retention-days: 14
          if-no-files-found: error

  qa-android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apks-${{ github.run_number }}
          path: qa-apks
      - name: Install QA dependencies
        run: python3 -m pip install requests beautifulsoup4 pillow
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Social dating housing groups mail notification QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'BEFORE_APK=qa-apks/Svoyi-Before-2.5.2-QA.apk AFTER_APK=qa-apks/Svoyi-Social-Core-2.5.3-QA.apk QA_OUT=finish253-qa python3 app-finish253/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish253-android16-qa-${{ github.run_number }}
          path: finish253-qa/
          retention-days: 14
          if-no-files-found: error

  smoke-android15:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apks-${{ github.run_number }}
          path: qa-apks
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Launch smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb install -r -g qa-apks/Svoyi-Social-Core-2.5.3-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish253 -c android.intent.category.LAUNCHER 1; sleep 8; adb shell pidof eu.svoyi.qa.finish253; ! adb logcat -d | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish253'

  smoke-android9:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apks-${{ github.run_number }}
          path: qa-apks
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 9 and large-font smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb shell settings put system font_scale 1.3; adb install -r -g qa-apks/Svoyi-Social-Core-2.5.3-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish253 -c android.intent.category.LAUNCHER 1; sleep 9; adb shell pidof eu.svoyi.qa.finish253; LOG="$(adb logcat -d)"; ! printf "%s" "$LOG" | grep -q "AbstractMethodError"; ! printf "%s" "$LOG" | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish253'

  publish:
    needs: [qa-android16, smoke-android15, smoke-android9]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-finish-253
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finish253-apks-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: finish253-android16-qa-${{ github.run_number }}
          path: proof
      - name: Publish verified APK and visual evidence
        run: |
          set -euo pipefail
          mkdir -p app-finish253/published
          cp -f release/* app-finish253/published/
          cp -f proof/checks.json app-finish253/published/
          for f in proof/before-after-*.png; do [ -f "$f" ] && cp -f "$f" app-finish253/published/; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-finish253/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified social core 2.5.3 QA'
          git push origin HEAD:android-app-finish-253
