name: Imagefix 2.4.5 signed acceptance
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths: ['image-fix245/ui.py', '.github/workflows/image-fix245-runtime.yml']
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        api: [35,36]
    env:
      QA_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve test-only probe from the pinned build
        uses: actions/download-artifact@v4
        with:
          name: imagefix245-unsigned-1
          run-id: 37330762112
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: unsigned-input
      - name: Download exact issued baseline and original-signed final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-input runtime-output
          curl --fail --proto '=https' --location --retry 2 --max-time 90 'https://test.jkunis.eu/android-update-20261005-v245-imagefix/Svoyi-Android-2.4.5.apk' -o signed-input/app.apk
          echo '95fe1ad2849c7719ecd4b5b559fbbb860eb69386ee2564f732e637f02ab38cdb  signed-input/app.apk' | sha256sum --check
          curl --fail --proto '=https' --location --retry 2 --max-time 90 'https://test.jkunis.eu/android-qa-20261005-v244-r1/Svoyi-Android-2.4.4.apk' -o signed-input/baseline244.apk
          echo '7c6441b64f81ad461eb763016bfab2d3b0cf0726b8db8705da96d1ad97907e10  signed-input/baseline244.apk' | sha256sum --check
          echo '7d86d65a96f2358f3a8e8e89bab12f1dffdc6f99bd822a4975a3850e3ff137c9  unsigned-input/cancellation-probe.jar' | sha256sum --check
          cp signed-input/app.apk runtime-output/Svoyi-Android-2.4.5.apk
          python3 -m pip install requests beautifulsoup4 playwright
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Ownership stress and visible user flows on exact final APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push unsigned-input/cancellation-probe.jar /data/local/tmp/probe.jar
            adb push signed-input/app.apk /data/local/tmp/final245.apk
            adb shell 'CLASSPATH=/data/local/tmp/probe.jar:/data/local/tmp/final245.apk app_process /system/bin eu.svoyi.qa.CancellationProbe candidate' > runtime-output/cancellation-final.json
            python3 image-fix245/ui.py
      - name: Save exact final APK and actual screenshots including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagefix245-final-api-${{ matrix.api }}-${{ github.run_number }}
          path: runtime-output/
          retention-days: 7
          if-no-files-found: error
