name: Native three-screen repair
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths:
      - 'qa-runtime/**'
      - '.github/workflows/native-three-screen-repair.yml'
permissions:
  contents: read
concurrency:
  group: native-three-screen-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare diagnostic tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-output tooling
          python3 -m pip install requests beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          curl -fL --retry 2 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip' -o tooling/jadx.zip
          unzip -q tooling/jadx.zip -d tooling/jadx
          chmod +x tooling/jadx/bin/jadx
          sha256sum tooling/jadx.zip > runtime-output/tool-checksums.txt
          APK=$(find qa-input -maxdepth 1 -name '*.apk' -type f | sort | head -n1)
          test -n "$APK"
          echo "QA_APK=$APK" >> "$GITHUB_ENV"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          from pathlib import Path
          z=zipfile.ZipFile(sys.argv[1]);Path('tooling/classes3.dex').write_bytes(z.read('classes3.dex'))
          PY
          baksmali disassemble tooling/classes3.dex -o runtime-output/smali
          tooling/jadx/bin/jadx --no-res -j 2 -d tooling/decompiled "$APK" > runtime-output/jadx.log 2>&1 || true
          if [ -d tooling/decompiled/sources/eu/svoyi ]; then cp -r tooling/decompiled/sources/eu/svoyi runtime-output/decompiled-svoyi; fi
          cp -r qa-runtime runtime-output/harness-source
          cp -r repair runtime-output/repair-source
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Real Android test with existing conversation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 repair/run-diagnostic.py
      - name: Upload real evidence even when regression fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-repair-${{ github.run_number }}
          path: runtime-output/
          retention-days: 7
          if-no-files-found: error
