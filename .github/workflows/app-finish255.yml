name: Final app 2.5.5 media and message actions

on:
  workflow_dispatch:
  push:
    branches: [android-app-finish]
    paths:
      - 'app-finish255/**'
      - '.github/workflows/app-finish255.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verified 2.5.4 baseline and tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          echo '7bd53cd66aad5aae50930119d61557067aa9de49f73f69f71181666e42dfe345  app-finish254/published/Svoyi-Final-2.5.4-QA.apk' | sha256sum --check
          cp app-finish254/published/Svoyi-Final-2.5.4-QA.apk app-finish255/baseline254.apk
      - name: Build 2.5.5 unsigned
        run: python3 app-finish255/build.py
      - name: Align and sign isolated QA APK
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -keystore /tmp/finish255.p12 -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias finishqa -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Svoyi Finish QA 2.5.5'
          "$BT/zipalign" -f 4 app-finish255/releases/Svoyi-Final-2.5.5-QA-unsigned.apk /tmp/finish255-aligned.apk
          "$BT/apksigner" sign --ks /tmp/finish255.p12 --ks-key-alias finishqa --ks-pass "pass:$PASS" --out app-finish255/releases/Svoyi-Final-2.5.5-QA.apk /tmp/finish255-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs app-finish255/releases/Svoyi-Final-2.5.5-QA.apk > app-finish255/releases/signature.txt
          "$BT/aapt" dump badging app-finish255/releases/Svoyi-Final-2.5.5-QA.apk > app-finish255/releases/badging.txt
          sha256sum app-finish255/releases/Svoyi-Final-2.5.5-QA.apk > app-finish255/releases/SHA256SUMS.txt
          rm -f app-finish255/releases/Svoyi-Final-2.5.5-QA-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: finish255-apk-${{ github.run_number }}
          path: app-finish255/releases/
          if-no-files-found: error
          retention-days: 14

  qa-android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finish255-apk-${{ github.run_number }}
          path: qa-apk
      - name: Install QA dependencies
        run: python3 -m pip install requests beautifulsoup4 pillow
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Real attachments, quote, edit, delete and draft QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'APK=qa-apk/Svoyi-Final-2.5.5-QA.apk BEFORE_APK=app-finish254/published/Svoyi-Final-2.5.4-QA.apk QA_OUT=finish255-qa python3 app-finish255/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish255-qa-${{ github.run_number }}
          path: finish255-qa/
          if-no-files-found: error
          retention-days: 14

  smoke-android15:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish255-apk-${{ github.run_number }}
          path: qa-apk
      - run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 15 launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb uninstall eu.svoyi.qa.finish252 || true; adb install -g qa-apk/Svoyi-Final-2.5.5-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 9; adb shell pidof eu.svoyi.qa.finish252; ! adb logcat -d | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  smoke-android9:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finish255-apk-${{ github.run_number }}
          path: qa-apk
      - run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 9 large-font legacy smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'set -e; adb shell settings put system font_scale 1.3; adb uninstall eu.svoyi.qa.finish252 || true; adb install -g qa-apk/Svoyi-Final-2.5.5-QA.apk; adb logcat -c; adb shell monkey -p eu.svoyi.qa.finish252 -c android.intent.category.LAUNCHER 1; sleep 10; adb shell pidof eu.svoyi.qa.finish252; LOG="$(adb logcat -d)"; ! printf "%s" "$LOG" | grep -q "AbstractMethodError"; ! printf "%s" "$LOG" | grep -A20 "FATAL EXCEPTION" | grep -q eu.svoyi.qa.finish252'

  publish:
    needs: [qa-android16, smoke-android15, smoke-android9]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-finish
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finish255-apk-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: finish255-qa-${{ github.run_number }}
          path: proof
      - name: Publish verified 2.5.5
        run: |
          set -euo pipefail
          mkdir -p app-finish255/published
          cp -f release/* app-finish255/published/
          cp -f proof/checks.json app-finish255/published/
          for f in before-after-mail.png after-mail-thread.png quote-reply.png file-staged.png file-sent.png photo-staged.png photo-sent.png edited.png deleted.png draft-after-picker.png; do
            [ ! -f "proof/$f" ] || cp -f "proof/$f" app-finish255/published/
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-finish255/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified media and message actions batch 2.5.5'
          git push origin HEAD:android-app-finish
