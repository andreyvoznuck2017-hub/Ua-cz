name: Build account preview APKs

on:
  workflow_dispatch:
  push:
    branches: [android-account-full]
    paths:
      - 'account-full251/AccountScreen251.java'
      - 'account-full251/build.py'
      - '.github/workflows/account-full251-build.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: batch20-unsigned-1
          run-id: 37354449484
          github-token: ${{ github.token }}
          path: baseline248
      - name: Prepare exact 2.4.9 baseline and Android tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          curl --fail --proto '=https' --location --retry 3 --max-time 120 \
            'https://test.jkunis.eu/android-home10-249-qa-db5f499b-r2/Svoyi-2.4.9-Home10-Code-and-QA.zip' \
            -o /tmp/home249.zip
          mkdir -p /tmp/home249
          unzip -q /tmp/home249.zip -d /tmp/home249
          MATCH="$(find /tmp/home249 -type f -name '*.apk' -print0 | xargs -0 sha256sum | awk '$1=="db5f499b94514c440f145d20026c2debe5b7d183e26fcbc8a4ce5558b4cbf2fa"{print $2; exit}')"
          test -n "$MATCH"
          cp "$MATCH" /tmp/baseline249-raw.apk
          echo 'db5f499b94514c440f145d20026c2debe5b7d183e26fcbc8a4ce5558b4cbf2fa  /tmp/baseline249-raw.apk' | sha256sum --check
          echo 'c97c63fcbe3ef497ff46594ff055ad0050fa2660c9e11d7bfe9c9e05af604041  baseline248/Svoyi-2.4.8-unsigned.apk' | sha256sum --check
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          old=zipfile.ZipFile('baseline248/Svoyi-2.4.8-unsigned.apk')
          new=zipfile.ZipFile('/tmp/baseline249-raw.apk')
          def zread(z,name):
              info=z.getinfo(name)
              with z.open(info) as fp:
                  fp._expected_crc=None
                  return fp.read()
          manifest=zread(new,'AndroidManifest.xml')
          classes3=zread(new,'classes3.dex')
          out=zipfile.ZipFile('account-full251/baseline249.apk','w',zipfile.ZIP_DEFLATED)
          for info in old.infolist():
              data=old.read(info.filename)
              if info.filename=='AndroidManifest.xml': data=manifest
              elif info.filename=='classes3.dex': data=classes3
              zi=zipfile.ZipInfo(info.filename, info.date_time)
              zi.compress_type=info.compress_type
              zi.external_attr=info.external_attr
              zi.create_system=info.create_system
              out.writestr(zi,data)
          out.close(); old.close(); new.close()
          PY
          REPAIRED_SHA="$(sha256sum account-full251/baseline249.apk | awk '{print $1}')"
          python3 - "$REPAIRED_SHA" <<'PY'
          import pathlib,sys
          p=pathlib.Path('account-full251/build.py')
          s=p.read_text()
          old='0ed539e8fe58dee7a4f3220673a29f6ad8a29b834caae34ac7d779dc45f26332'
          assert old in s
          p.write_text(s.replace(old,sys.argv[1]))
          PY
          unzip -t account-full251/baseline249.apk >/dev/null
      - name: Build and sign both isolated QA variants
        run: python3 account-full251/build.py
      - name: Upload account APKs
        uses: actions/upload-artifact@v4
        with:
          name: account-previews-${{ github.run_number }}
          path: account-full251/releases/
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: account-previews-${{ github.run_number }}
          path: candidate
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Install and launch both APKs on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
            mkdir -p smoke
            for APK in candidate/*.apk; do
              PKG="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
              test -n "$PKG"
              adb install -r "$APK"
              adb logcat -c
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
              sleep 5
              adb shell pidof "$PKG" > "smoke/$(basename "$APK").pid" || true
              adb logcat -d > "smoke/$(basename "$APK").log"
              if grep -A20 -B5 'FATAL EXCEPTION' "smoke/$(basename "$APK").log" | grep -q "$PKG"; then
                echo "Fatal crash in $PKG"
                exit 1
              fi
              adb uninstall "$PKG"
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-preview-smoke-${{ github.run_number }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-account-full
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: account-previews-${{ github.run_number }}
          path: published
      - name: Publish verified APKs to branch
        run: |
          set -euo pipefail
          mkdir -p account-full251/releases
          cp -f published/* account-full251/releases/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-full251/releases
          if git diff --cached --quiet; then
            echo 'No release changes'
            exit 0
          fi
          git commit -m 'Publish verified account preview APKs'
          git push origin HEAD:android-account-full
