name: Android Live UI QA

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct HTTPS URL to APK. Leave empty to build app-debug.apk from this repository.'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Optional package name. Leave empty to detect from APK.'
        required: false
        default: ''
        type: string
  push:
    branches: [ android-live-qa ]
    paths:
      - '.github/workflows/android-live-qa.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  live-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ inputs.apk_url == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK from repository
        if: ${{ inputs.apk_url == '' }}
        run: gradle :app:assembleDebug

      - name: Download supplied APK
        if: ${{ inputs.apk_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-input
          curl --fail --location --retry 3 --retry-delay 2 \
            '${{ inputs.apk_url }}' \
            --output qa-input/app-under-test.apk

      - name: Select APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n '${{ inputs.apk_url }}' ]; then
            APK='qa-input/app-under-test.apk'
          else
            APK='app/build/outputs/apk/debug/app-debug.apk'
          fi
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK selected: $APK"
          sha256sum "$APK"

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Boot Android and capture real UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            mkdir -p qa-output

            {
              echo "=== DEVICE ==="
              adb shell getprop ro.product.model
              adb shell getprop ro.build.version.release
              adb shell wm size
              adb shell wm density
              adb shell settings get system font_scale
              echo "=== APK ==="
              sha256sum "$APK_PATH"
            } > qa-output/device.txt 2>&1 || true

            PACKAGE='${{ inputs.package_name }}'
            if [ -z "$PACKAGE" ]; then
              PACKAGE="$(aapt dump badging "$APK_PATH" 2>/dev/null | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
            fi
            echo "$PACKAGE" > qa-output/package.txt

            adb logcat -c || true
            adb install -r -g "$APK_PATH" > qa-output/install.txt 2>&1 || \
              adb install -r "$APK_PATH" >> qa-output/install.txt 2>&1

            adb shell pm list packages | grep -F "$PACKAGE" >> qa-output/install.txt 2>&1 || true

            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 \
              > qa-output/launch.txt 2>&1 || true

            sleep 3
            adb exec-out screencap -p > qa-output/01-launch-3s.png || true
            adb shell uiautomator dump /sdcard/window-3s.xml > /dev/null 2>&1 || true
            adb pull /sdcard/window-3s.xml qa-output/01-window-3s.xml > /dev/null 2>&1 || true

            sleep 12
            adb exec-out screencap -p > qa-output/02-launch-15s.png || true
            adb shell uiautomator dump /sdcard/window-15s.xml > /dev/null 2>&1 || true
            adb pull /sdcard/window-15s.xml qa-output/02-window-15s.xml > /dev/null 2>&1 || true

            adb shell dumpsys activity activities > qa-output/dumpsys-activity.txt 2>&1 || true
            adb shell dumpsys window windows > qa-output/dumpsys-window.txt 2>&1 || true
            adb shell dumpsys package "$PACKAGE" > qa-output/dumpsys-package.txt 2>&1 || true
            adb logcat -d -v threadtime > qa-output/logcat.txt 2>&1 || true

            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb exec-out screencap -p > qa-output/03-after-back.png || true

            {
              echo "=== CRASH / ANR SCAN ==="
              grep -E -i 'FATAL EXCEPTION|ANR in |Process: .* has died|AndroidRuntime' qa-output/logcat.txt || true
            } > qa-output/crash-scan.txt

      - name: Upload screenshots, UI hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-ui-qa-${{ github.run_number }}
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
