name: Android Live UI QA
# trigger: first live emulator run

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct HTTPS URL to APK. Leave empty to build app-debug.apk from this repository.'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Optional package name. Leave empty to detect from APK.'
        required: false
        default: ''
        type: string
  push:
    branches: [ android-live-qa ]
    paths:
      - '.github/workflows/android-live-qa.yml'
      - '.github/scripts/**'
      - 'qa-input/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  live-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ inputs.apk_url == '' && hashFiles('qa-input/Svoyi-Europe-Android-v2.4.1-Profile-QA.apk') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK from repository
        if: ${{ inputs.apk_url == '' && hashFiles('qa-input/Svoyi-Europe-Android-v2.4.1-Profile-QA.apk') == '' }}
        run: gradle :app:assembleDebug

      - name: Download supplied APK
        if: ${{ inputs.apk_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-input
          curl --fail --location --retry 3 --retry-delay 2 \
            '${{ inputs.apk_url }}' \
            --output qa-input/app-under-test.apk

      - name: Select APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n '${{ inputs.apk_url }}' ]; then
            APK='qa-input/app-under-test.apk'
          elif [ -s 'qa-input/Svoyi-Europe-Android-v2.4.1-Profile-QA.apk' ]; then
            APK='qa-input/Svoyi-Europe-Android-v2.4.1-Profile-QA.apk'
          else
            APK='app/build/outputs/apk/debug/app-debug.apk'
          fi
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK selected: $APK"
          sha256sum "$APK"

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Boot Android and capture real UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            QA_PACKAGE_NAME='${{ inputs.package_name }}' bash .github/scripts/android-live-qa.sh

      - name: Upload screenshots, UI hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-ui-qa-${{ github.run_number }}
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
