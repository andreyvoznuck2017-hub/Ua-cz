name: Build mail stability 2.4.3 unsigned
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths:
      - 'mail-stability/*.java'
      - 'mail-stability/build_unsigned.py'
      - 'mail-stability/prepare_build.py'
      - '.github/workflows/mail-stability-build.yml'
permissions:
  contents: read
concurrency:
  group: mail-stability-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact delivered baseline and prepare assembler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compatibility-input mail-candidate-output
          curl --fail --proto '=https' --location --max-time 90 --retry 2 'https://test.jkunis.eu/android-update-20261005-v242/Svoyi-Android-2.4.2-QA.apk' -o compatibility-input/app.apk
          echo '32f42f59e8feef706a8b8c1aff7ac8852a6e9949e315d3cf942199e49f0b07bd  compatibility-input/app.apk' | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
      - name: Compile exact changed classes and preserve unrelated APK entries
        run: python3 mail-stability/prepare_build.py
      - name: Record output integrity
        run: |
          cd mail-candidate-output
          sha256sum *.apk *.jar > unsigned-checksums.txt
      - name: Upload unsigned candidate and separate probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-stability-unsigned-${{ github.run_number }}
          path: mail-candidate-output/
          retention-days: 7
          if-no-files-found: error
