name: Svoyi 2.5.6 build and native QA
on:
  push:
    branches: [android-app-complete-256]
    paths: ['app-finish256/**', 'release256/**', '.github/workflows/app-finish256.yml']
permissions:
  contents: read
concurrency:
  group: app-complete-256
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build verified native payload
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsmali-java
          cp app-finish254/published/Svoyi-Final-2.5.4-QA.apk app-finish256/baseline254.apk
          javac -d /tmp/dating-contract app-finish256/DatingRoute256.java app-finish256/DatingRoute256Test.java
          java -cp /tmp/dating-contract eu.svoyi.nativeapp.DatingRoute256Test
          python3 app-finish256/build.py
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          export QA_KEY_PASSWORD="$(openssl rand -hex 18)"
          keytool -genkeypair -keystore /tmp/qa.p12 -storetype PKCS12 -storepass:env QA_KEY_PASSWORD -keypass:env QA_KEY_PASSWORD -alias qa -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Svoyi Isolated QA'
          "$BT/zipalign" -f 4 app-finish256/releases/Svoyi-2.5.6-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/qa.p12 --ks-pass env:QA_KEY_PASSWORD --out app-finish256/releases/candidate-QA-only.apk /tmp/aligned.apk
          "$BT/zipalign" -c 4 app-finish256/releases/candidate-QA-only.apk
          "$BT/apksigner" verify --min-sdk-version 26 --max-sdk-version 36 app-finish256/releases/candidate-QA-only.apk
          cp app-finish256/releases/Svoyi-2.5.6-unsigned.apk /tmp/first-build.apk
          python3 app-finish256/build.py
          cmp /tmp/first-build.apk app-finish256/releases/Svoyi-2.5.6-unsigned.apk
          "$BT/apksigner" verify --min-sdk-version 26 --max-sdk-version 36 --print-certs release256/Svoyi-2.5.6.apk
          "$BT/zipalign" -c 4 release256/Svoyi-2.5.6.apk
          "$BT/aapt" dump badging app-finish256/releases/candidate-QA-only.apk > app-finish256/releases/package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: payload-256
          path: app-finish256/releases/
          retention-days: 14
  verify:
    needs: build
    if: contains(github.event.head_commit.message, '[signed]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: payload-256
          path: payload
      - name: Prepare native QA
        run: |
          python3 -m pip install requests beautifulsoup4 pillow
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'APK=release256/Svoyi-2.5.6.apk BEFORE_APK=release256/Svoyi-2.5.5.apk QA_API=${{ matrix.api }} QA_OUT=completion-qa python3 app-finish256/qa.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-api${{ matrix.api }}-${{ github.run_number }}
          path: completion-qa/
          retention-days: 14
