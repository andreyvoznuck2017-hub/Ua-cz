name: Quote editor 2.4.7 isolated runtime
on:
  workflow_dispatch:
  push:
    branches: [android-live-qa]
    paths: ['mail-compose247/runtime_entry.py', '.github/workflows/mail-compose247-ci.yml']
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Explicit targeted infrastructure retry; ordinary pushes and manual runs test both APIs.
        api: ${{ fromJSON(contains(github.event.head_commit.message, '[retry-api35]') && '[35]' || '[35,36]') }}
    env:
      QA_API: ${{ matrix.api }}
      QA_CI_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: mail-compose247-unsigned-1
          run-id: 37345161152
          github-token: ${{ github.token }}
          path: candidate247
      - name: Prepare code-identical internal test APKs with temporary CI key
        run: |
          set -euo pipefail
          mkdir -p signed-input runtime-output
          curl --fail --proto '=https' --location --retry 2 --max-time 90 'https://test.jkunis.eu/android-update-20261005-v245-imagefix/Svoyi-Android-2.4.5.apk' -o signed-input/original245.apk
          echo '95fe1ad2849c7719ecd4b5b559fbbb860eb69386ee2564f732e637f02ab38cdb  signed-input/original245.apk' | sha256sum --check
          echo '8ae3acf1150b6422ec8309e7477c398d7461082e9bda35d00877ffdb08f5af42  candidate247/Svoyi-2.4.7-unsigned.apk' | sha256sum --check
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-only.p12" -storetype PKCS12 -storepass changeit -keypass changeit -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Svoyi CI Only'
          java -jar candidate247/apksigner.jar sign --ks "$RUNNER_TEMP/ci-only.p12" --ks-pass pass:changeit --out signed-input/baseline245.apk signed-input/original245.apk
          java -jar candidate247/apksigner.jar sign --ks "$RUNNER_TEMP/ci-only.p12" --ks-pass pass:changeit --out signed-input/app.apk candidate247/Svoyi-2.4.7-unsigned.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          def h(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for before,after in [('signed-input/original245.apk','signed-input/baseline245.apk'),('candidate247/Svoyi-2.4.7-unsigned.apk','signed-input/app.apk')]:
           with zipfile.ZipFile(before) as a,zipfile.ZipFile(after) as b:
            for n in a.namelist():
             if not n.startswith('META-INF/'):assert a.read(n)==b.read(n),n
          actual=h('signed-input/app.apk')
          with open(os.environ['GITHUB_ENV'],'a') as e:e.write('QA_SHA256='+actual+'\n')
          Path('runtime-output/ci-provenance.json').write_text(json.dumps({'original245Sha256':h('signed-input/original245.apk'),'unsigned247Sha256':h('candidate247/Svoyi-2.4.7-unsigned.apk'),'ciApkSha256':actual,'ciBaselineSha256':h('signed-input/baseline245.apk'),'originalUserKeyAccessed':False,'originalSignatureCompatible':False,'temporarySigningOnly':True,'allNonSignatureEntriesByteEqual':True,'notForUserInstallation':True},indent=2))
          PY
          python3 -m pip install requests beautifulsoup4 playwright pillow
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Exercise real UI quote state editor files drafts and reactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mail-compose247/runtime_entry.py
      - name: Keep failures and screenshots without distributing CI-signed APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose247-ci-api-${{ matrix.api }}-${{ github.run_number }}
          path: |
            runtime-output/
            !runtime-output/*.apk
          retention-days: 7
          if-no-files-found: error
